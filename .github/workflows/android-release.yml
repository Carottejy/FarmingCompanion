name: Android release (APK)

# Publier une version : mettre à jour la version (app.json, package.json, src/releaseNotes.ts)
# et pousser sur main. Si la release vX.Y.Z n'existe pas encore, ce workflow construit l'APK,
# crée le tag et la release GitHub que l'onglet « À propos » de l'application détecte.
# (Pousser un tag v* manuellement fonctionne aussi.)

on:
  push:
    branches: [main]
    paths: ['app.json', '.github/workflows/android-release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Version
        id: v
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à app.json ($VERSION)"; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v$VERSION existe déjà : rien à publier."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate native Android project
        if: steps.v.outputs.exists != 'true'
        run: npx expo prebuild --platform android --no-install

      # Clé de signature stable : sans elle, chaque build aurait une clé différente et
      # Android refuserait d'installer la mise à jour par-dessus l'ancienne version.
      - name: Signing key
        if: steps.v.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/debug.keystore
            echo "Clé de signature du dépôt utilisée."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : APK signé avec une clé temporaire (les mises à jour exigeront une désinstallation)."
          fi

      - name: Build APK
        if: steps.v.outputs.exists != 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        if: steps.v.outputs.exists != 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FarmingCompanion-v${{ steps.v.outputs.version }}.apk"

      - name: Release notes
        if: steps.v.outputs.exists != 'true'
        run: npx tsx scripts/release-body.ts "${{ steps.v.outputs.version }}" > dist/body.md

      - name: Publish GitHub release
        if: steps.v.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FarmingCompanion ${{ steps.v.outputs.version }}
          body_path: dist/body.md
          files: dist/*.apk

      - name: Upload artifact
        if: steps.v.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FarmingCompanion-apk
          path: dist/*.apk
